<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styles.css" />

    <title>QR code component</title>
  </head>

  <body class="d-grid min-vh-100 p-3 m-2 bg-white qr-body">
    <main class="w-100 d-flex flex-column gap-4 bg-white qr-card">
      <img
        src="./images/image-qr-code.png"
        alt="QR Code"
        class="d-block w-100 h-auto qr-img"
      />

      <div class="d-flex flex-column gap-3 p-3 text-center">
        <h1 class="fw-bold qr-title">
          Improve your front-end skills by building projects
        </h1>
        <p class="qr-text">
          Scan the QR code to visit Frontend Mentor and take your coding skills
          to the next level
        </p>
      </div>
    </main>
    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">M.Eltoukhy</a>.
    </footer>
  </body>
</html>
